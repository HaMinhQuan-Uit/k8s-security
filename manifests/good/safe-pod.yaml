apiVersion: v1
kind: Pod
metadata:
  name: good-pod
spec:
  containers:
    - name: good
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: false
        runAsNonRoot: true
        runAsUser: 1000
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"

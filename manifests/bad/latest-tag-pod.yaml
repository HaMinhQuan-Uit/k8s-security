apiVersion: v1
kind: Pod
metadata:
  name: bad-latest
spec:
  containers:
    - name: bad
      image: nginx:latest
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"

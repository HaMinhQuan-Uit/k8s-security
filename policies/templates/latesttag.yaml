apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8slatesttag
spec:
  crd:
    spec:
      names:
        kind: K8sLatestTag
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8slatesttag

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          endswith(container.image, ":latest")
          msg := sprintf("Container %s uses :latest tag, use specific version instead", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not contains(container.image, ":")
          msg := sprintf("Container %s has no tag, use specific version", [container.name])
        }
